<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const PI=Math.PI;
const PAL=[0x8db3d6,0xe9a074,0x9cc7a4,0xf0cd6e,0xb8a3d1,0x7cc0bb,0xe58e95,0xd2cbbd];
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf3f1ec);
const camera=new THREE.PerspectiveCamera(24,1,0.05,300);
camera.position.set(10,5.8,11.7);
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true;
controls.target.set(0,0.6,0);
scene.add(new THREE.HemisphereLight(0xffffff,0xd6d0c4,1.7));
const sun=new THREE.DirectionalLight(0xffffff,0.7);sun.position.set(5,10,7);scene.add(sun);
const grid=new THREE.GridHelper(30,60,0xe0dbd0,0xe9e5dc);grid.position.y=-0.002;scene.add(grid);

/* geometry helpers. car axes: x forward, y up, z toward the left side */
function box(w,h,d){return new THREE.BoxGeometry(w,h,d)}
function cyl(r1,r2,h,ax='y',seg=24){const g=new THREE.CylinderGeometry(r1,r2,h,seg);if(ax==='x')g.rotateZ(PI/2);if(ax==='z')g.rotateX(PI/2);return g}
function lathe(pts,ax='y',seg=40){const g=new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg);if(ax==='z')g.rotateX(PI/2);if(ax==='x')g.rotateZ(-PI/2);return g}
function ring(r1,r2,h,ax='y',seg=40){return lathe([[r1,-h/2],[r2,-h/2],[r2,h/2],[r1,h/2],[r1,-h/2]],ax,seg)}
function sph(r){return new THREE.SphereGeometry(r,12,8)}
function rz(g,a){g.rotateZ(a);return g}
function rod(a,b,r,seg=12){const A=V(...a),B=V(...b),d=B.clone().sub(A);const g=new THREE.CylinderGeometry(r,r,d.length(),seg);g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(V(0,1,0),d.clone().normalize()));return{geo:g,pos:A.clone().add(B).multiplyScalar(0.5)}}
function coil(r,h,turns,w){const pts=[],n=turns*20;for(let i=0;i<=n;i++){const t=i/n,a=t*turns*2*PI;pts.push(V(Math.cos(a)*r,t*h-h/2,Math.sin(a)*r))}return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),n,w,6,false)}
function side(build,z,t=0.03){const sh=new THREE.Shape();build(sh);const g=new THREE.ExtrudeGeometry(sh,{depth:t,bevelEnabled:false,curveSegments:24});g.computeBoundingBox();const c=new THREE.Vector3();g.boundingBox.getCenter(c);g.translate(-c.x,-c.y,-c.z);return{geo:g,pos:V(c.x,c.y,z)}}
const poly=pts=>sh=>{sh.moveTo(...pts[0]);pts.slice(1).forEach(p=>sh.lineTo(...p));sh.closePath()};
const WY=0.297;
function arc(r,h,start,len){const g=new THREE.CylinderGeometry(r,r,h,20,1,true,start,len);g.rotateX(PI/2);return g}

const ASM=[];
function asm(name,desc,dir,fn,dx=0){
  const a={name,desc,dir:V(...dir),parts:[],amt:0,target:0};
  const P=(n,d,geo,pos,off)=>{
    if(geo.geo){off=pos;pos=geo.pos;geo=geo.geo}
    const v=pos.isVector3?pos.clone():V(...pos);v.x+=dx;a.parts.push({name:n,desc:d,geo,pos:v,off:off?V(...off):null,asm:a});
  };
  fn(P);ASM.push(a);
}

/* WHEEL PARTS shared by all four corners, drawn in hub units then scaled */
const K=0.0958;
const TIRE=[[2.2,-0.8],[2.75,-0.95],[3.05,-0.6],[3.1,0],[3.05,0.6],[2.75,0.95],[2.2,0.8]];
const WHEEL=[[0.5,0.25],[1.6,0.3],[1.9,0.1],[2.2,-0.7],[2.25,-0.8],[2.25,0.8],[2.2,0.7],[1.9,0.45],[1.6,0.45],[0.5,0.4]];
const CAP=[[0,0.55],[0.9,0.5],[1.3,0.35],[1.35,0.2],[1.3,0.15]];
function corner(P,cx,cz,s){
  const sc=g=>{g.scale(K,K,K*s);return g};
  const L=(pts,seg=48)=>sc(lathe(pts,'z',seg));
  const at=(x,y,z)=>[cx+x*K,WY+y*K,cz+z*K*s];
  const o=(x,y,z)=>[x*K,y*K,z*K*s];
  P('Tire','165SR13 steel belted radial.',L(TIRE,64),at(0,0,0),o(0,0,9));

  const c=V(0,0,0);a.parts.forEach(p=>c.add(p.pos));c.divideScalar(a.parts.length);a.center=c;
  a.group=new THREE.Group();a.group.position.copy(c);scene.add(a.group);
  let rad=0;
  a.parts.forEach((p,i)=>{
    total++;
    p.local=p.pos.clone().sub(c);
    if(!p.off){const d=p.local.clone(),l=d.length();p.off=l<0.02?V(0,0,0):d.normalize().multiplyScalar(0.2+l*1.3)}
    const col=PAL[(ai*3+i)%8];
    p.mat=new THREE.MeshStandardMaterial({color:col,transparent:true,opacity:1,roughness:1,metalness:0,flatShading:true,side:THREE.DoubleSide});
    p.mesh=new THREE.Mesh(p.geo,p.mat);p.mesh.userData.part=p;
    p.edges=new THREE.LineSegments(new THREE.EdgesGeometry(p.geo,20),new THREE.LineBasicMaterial({color:0x3d3d3d,transparent:true}));
    p.wf=new THREE.LineSegments(new THREE.WireframeGeometry(p.geo),new THREE.LineBasicMaterial({color:new THREE.Color(col).multiplyScalar(0.75),transparent:true,opacity:0.2}));
    p.node=new THREE.Group();p.node.add(p.mesh,p.edges,p.wf);p.node.position.copy(p.local);a.group.add(p.node);
    p.geo.computeBoundingSphere();
    rad=Math.max(rad,p.local.clone().add(p.off).length()+p.geo.boundingSphere.radius);
  });
  a.radius=rad;
});

/* STATE AND UI */
let carAmt=0,carTarget=0,focus=null,selected=null,wire=false,fly=0,labelsOn=true;
/* INFO CARD: lives in the scene above the selected item, so it shrinks when you zoom out */
let typeKey='',typeText='',typeN=0,head=['',''],infoOn=true,typedAt=0,cardColor='#8db3d6';
const card=document.createElement('canvas');card.width=512;card.height=400;const cg=card.getContext('2d');
const cardMat=new THREE.SpriteMaterial({depthTest:false,transparent:true});
const sprite=new THREE.Sprite(cardMat);sprite.center.set(0.5,0);sprite.renderOrder=10;sprite.visible=false;scene.add(sprite);
const leader=new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(0,0,0),V(0,1,0)]),new THREE.LineBasicMaterial({color:0x3d3d3d,depthTest:false}));leader.renderOrder=10;leader.visible=false;scene.add(leader);
function wrap(t,n=34){const out=[];t.split('\n').forEach(ln=>{if(ln.length<=n){out.push(ln);return}let cur='';ln.split(' ').forEach(w=>{if((cur+' '+w).trim().length>n){out.push(cur);cur=w}else cur=(cur+' '+w).trim()});out.push(cur)});return out}
function sizeCard(){const n=wrap(typeText).length;const h=120+n*28;card.height=h;if(cardMat.map)cardMat.map.dispose();cardMat.map=new THREE.CanvasTexture(card);cardMat.map.colorSpace=THREE.SRGBColorSpace;cardMat.needsUpdate=true}
function drawCard(){
  const w=card.width,h=card.height;cg.clearRect(0,0,w,h);
  cg.fillStyle='#ffffff';cg.fillRect(0,0,w,h);
  cg.strokeStyle='#3d3d3d';cg.lineWidth=3;cg.strokeRect(1.5,1.5,w-3,h-3);
  cg.fillStyle=cardColor;cg.fillRect(1.5,1.5,12,h-3);
  cg.fillStyle='#8a8a8a';cg.font='20px Helvetica Neue, Helvetica, Arial, sans-serif';cg.fillText(head[0],30,36);
  cg.fillStyle='#3d3d3d';cg.font='bold 28px Helvetica Neue, Helvetica, Arial, sans-serif';cg.fillText(head[1].toUpperCase().slice(0,26),30,72);
  cg.fillStyle='#3d3d3d';cg.font='22px Courier New, monospace';
  const lines=wrap(typeText.slice(0,typeN));let y=110;
  lines.forEach(l=>{cg.fillText(l,30,y);y+=28});
  if(typeN<typeText.length||performance.now()-typedAt<1500){if(Math.floor(performance.now()/250)%2===0){const last=lines[lines.length-1]||'';cg.fillStyle='#e9a074';cg.fillRect(30+cg.measureText(last).width+2,y-28-20,13,24)}}
  cardMat.map.needsUpdate=true;
}
/* CALLOUT LABELS on every part of an exploded assembly */
const LBL=new Map();
function label(p){
  if(LBL.has(p))return LBL.get(p);
  const c=document.createElement('canvas'),g=c.getContext('2d'),f='500 30px Helvetica Neue, Helvetica, Arial, sans-serif';
  g.font=f;const w=Math.ceil(g.measureText(p.name).width)+28;c.width=w;c.height=46;
  g.fillStyle='rgba(255,255,255,0.92)';g.fillRect(0,0,w,46);g.fillStyle='#'+p.mat.color.getHexString();g.fillRect(0,0,8,46);
  g.font=f;g.fillStyle='#3d3d3d';g.fillText(p.name,16,32);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));
  sp.center.set(0,0.5);sp.renderOrder=9;sp.userData.aspect=w/46;sp.visible=false;scene.add(sp);LBL.set(p,sp);return sp;
}
const callLines=new THREE.LineSegments(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0x3d3d3d,depthTest:false,transparent:true,opacity:0.8}));callLines.renderOrder=9;scene.add(callLines);
function typeOut(key,text){if(key===typeKey)return;typeKey=key;typeText=text;typeN=0;sizeCard()}
const row=(l,v)=>(l+' ').padEnd(14,'.')+' '+v;
const mm=v=>Math.round(v*1000);
function homeBox(p){p.geo.computeBoundingBox();const b=p.geo.boundingBox.clone();const c=p.asm.center.clone().add(p.local);b.min.add(c);b.max.add(c);return b}
function sizeTxt(b){const d=new THREE.Vector3();b.getSize(d);return 'L '+mm(d.x)+' x H '+mm(d.y)+' x W '+mm(d.z)+' MM'}
function locTxt(b){const c=new THREE.Vector3();b.getCenter(c);return [row('FROM FRONT',mm(2.205-c.x)+' MM'),row('HEIGHT',mm(c.y)+' MM'),row('SIDE',c.z>0.05?'LEFT':c.z<-0.05?'RIGHT':'CENTER')]}
const list=document.getElementById('list'),slide=document.getElementById('slide');

function refresh(){
  const base=wire?0.3:1;
  ASM.forEach(a=>a.parts.forEach(p=>{
    const off=focus&&a!==focus, dim=selected&&p!==selected;
    p.mat.opacity=off?0.04:dim?0.1:base;
    p.mat.depthWrite=!wire&&!off&&!dim;
    p.edges.material.opacity=off?0.06:dim?0.15:wire?0.9:0.75;
    p.wf.visible=wire&&!off&&!dim;
  }));
  if(selected){
    const b=homeBox(selected),i=focus.parts.indexOf(selected)+1;
    head=['1982 ACCORD / '+focus.name.toUpperCase(),selected.name];cardColor='#'+selected.mat.color.getHexString();
    typeOut('p'+focus.name+i,[row('ASSEMBLY',focus.name.toUpperCase()),row('PART',i+' OF '+focus.parts.length),row('SIZE',sizeTxt(b)),...locTxt(b),'',selected.desc.toUpperCase()].join('\n'));
  }else if(focus){
    const b=new THREE.Box3();focus.parts.forEach(p=>b.union(homeBox(p)));
    head=['1982 ACCORD',focus.name];cardColor='#'+focus.parts[0].mat.color.getHexString();
    typeOut('a'+focus.name,[row('PARTS',focus.parts.length),row('SIZE',sizeTxt(b)),...locTxt(b),'',focus.desc.toUpperCase(),'','> TAP TO EXPLODE, TAP A PART TO INSPECT'].join('\n'));
  }else{typeKey=''}
  list.innerHTML='';
  (focus?focus.parts:ASM).forEach(it=>{
    const d=document.createElement('div');d.textContent=it.name;
    if(it===selected||(!focus&&it===focus))d.className='sel';
    d.onclick=()=>{if(focus){focus.target=1;selected=it;refresh()}else{carTarget=1;open(it)}};
    list.appendChild(d);
  });
}
function open(a){if(focus&&focus!==a)focus.target=0;focus=a;selected=null;fly=90;refresh()}
function back(){
  if(selected){selected=null}
  else if(focus){focus.target=0;focus=null;fly=90}
  else{carTarget=0;fly=90}
  refresh();
}
function setWire(on){wire=on;document.getElementById('bWire').classList.toggle('on',on);refresh()}

document.getElementById('bBack').onclick=back;
document.getElementById('bLbl').onclick=e=>{labelsOn=!labelsOn;e.target.classList.toggle('on',labelsOn)};
document.getElementById('bInfo').onclick=e=>{infoOn=!infoOn;e.target.classList.toggle('on',infoOn)};
document.getElementById('bBP').onclick=e=>{showBP=!showBP;BP.forEach(m=>m.visible=showBP);e.target.classList.toggle('on',showBP)};
document.getElementById('bExplode').onclick=()=>{fly=90;if(focus)focus.target=focus.target>0.5?0:1;else{carTarget=carTarget>0.5?0:1;fly=90}};
document.getElementById('bWire').onclick=()=>setWire(!wire);
document.getElementById('bParts').onclick=e=>{const s=list.style.display==='block';list.style.display=s?'none':'block';e.target.classList.toggle('on',!s)};
document.getElementById('bReset').onclick=()=>{ASM.forEach(a=>a.target=0);carTarget=0;focus=null;selected=null;fly=90;refresh()};
slide.oninput=()=>{const v=slide.value/100;if(focus){focus.target=v;focus.amt=v}else{carTarget=v;carAmt=v}};

const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
let down=null;
canvas.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY]});
canvas.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;
  ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ptr,camera);
  const meshes=a=>a.parts.map(p=>p.mesh);
  if(focus){
    const hit=ray.intersectObjects(meshes(focus),false)[0];
    if(hit){
      if(focus.amt<0.5&&focus.target<0.5){focus.target=1;fly=90;return}
      selected=hit.object.userData.part;refresh();return;
    }
  }
  const all=[];ASM.forEach(a=>{if(a!==focus)all.push(...meshes(a))});
  const hit=ray.intersectObjects(all,false)[0];
  if(!hit){if(selected){selected=null;refresh()}return}
  const a=hit.object.userData.part.asm;
  if(carAmt<0.5&&carTarget<0.5){carTarget=1;fly=90;return}
  open(a);
});

function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
refresh();

const goal=V(0,0,0);
(function loop(){
  requestAnimationFrame(loop);
  carAmt+=(carTarget-carAmt)*0.07;
  ASM.forEach(a=>{
    a.amt+=(a.target-a.amt)*0.08;
    a.group.position.copy(a.center).addScaledVector(a.dir,carAmt);
    a.parts.forEach(p=>p.node.position.copy(p.local).addScaledVector(p.off,a.amt));
  });
  if(!document.activeElement||document.activeElement!==slide)slide.value=Math.round((focus?focus.amt:carAmt)*100);
  if(fly>0){
    fly--;
    let dist;
    if(focus){goal.copy(focus.group.position);dist=Math.max(1.6,focus.radius*(1.5+focus.target*2.2))}
    else{goal.set(0,0.6+carTarget*0.6,0);dist=11+carTarget*8}
    controls.target.lerp(goal,0.08);
    const d=camera.position.clone().sub(controls.target),l=d.length();
    camera.position.copy(controls.target).add(d.multiplyScalar((l+(dist-l)*0.08)/l));
  }
  LBL.forEach(sp=>sp.visible=false);
  const pts=[];
  if(labelsOn&&focus&&!selected&&focus.amt>0.6){
    const h=Math.min(0.08,Math.max(0.035,focus.radius*0.03)),wp=new THREE.Vector3(),cr=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0);
    focus.parts.forEach(p=>{const sp=label(p);p.node.getWorldPosition(wp);const lp=wp.clone().add(V(0,h*2.2,0)).addScaledVector(cr,h*1.2);sp.position.copy(lp);sp.scale.set(h*sp.userData.aspect,h,1);sp.visible=true;pts.push(wp.clone(),lp)});
  }
  callLines.geometry.setFromPoints(pts);callLines.visible=pts.length>0;
  const tgt=infoOn&&(selected?selected.node:focus?focus.group:null);
  sprite.visible=leader.visible=!!tgt;
  if(tgt){
    if(typeN<typeText.length){typeN=Math.min(typeText.length,typeN+4);typedAt=performance.now()}
    drawCard();
    const bb=new THREE.Box3().setFromObject(tgt),c=new THREE.Vector3(),sz=new THREE.Vector3();bb.getCenter(c);bb.getSize(sz);
    const W=Math.min(1.3,Math.max(0.5,Math.max(sz.x,sz.z)*0.7));
    sprite.scale.set(W,W*card.height/card.width,1);
    const top=V(c.x,bb.max.y,c.z),at=V(c.x,bb.max.y+0.2+W*0.15,c.z);
    sprite.position.copy(at);
    leader.geometry.setFromPoints([top,at]);
  }
  controls.update();renderer.render(scene,camera);
})();
</script>
</body>
</html>
